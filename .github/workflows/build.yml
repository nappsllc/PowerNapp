name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # attach files to the release on tag pushes

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build powernapp.exe
        shell: cmd
        run: build.bat

      - name: English template in sync (lang\en.txt)
        shell: pwsh
        run: ./tools/gen-lang-template.ps1 -Check

      - name: Unit tests
        shell: cmd
        run: tests\unit\build.bat

      - name: Smoke test CLI
        shell: pwsh
        run: |
          $out = & .\powernapp.exe --help | Out-String
          if ($out -notmatch 'PowerNapp') { throw "unexpected --help output: $out" }

      - name: Build installer
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { choco install nsis -y --no-progress; if ($LASTEXITCODE) { exit 1 } }
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.TrimStart('v') } else { '1.0.0' }
          & $nsis /V2 /DVERSION=$version installer\powernapp.nsi
          if ($LASTEXITCODE) { exit 1 }

      - name: Build Store package (MSIX)
        shell: pwsh
        # identity from Partner Center, set as repository variables; placeholders otherwise
        env:
          MSIX_NAME: ${{ vars.MSIX_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_NAME: ${{ vars.MSIX_PUBLISHER_NAME }}
          MSIX_DISPLAY_NAME: ${{ vars.MSIX_DISPLAY_NAME }}
        run: |
          $a = @{}
          if ($env:MSIX_DISPLAY_NAME) { $a.DisplayName = $env:MSIX_DISPLAY_NAME }
          if ($env:MSIX_NAME) { $a.Name = $env:MSIX_NAME }
          if ($env:MSIX_PUBLISHER) { $a.Publisher = $env:MSIX_PUBLISHER }
          if ($env:MSIX_PUBLISHER_NAME) { $a.PublisherDisplayName = $env:MSIX_PUBLISHER_NAME }
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $a.Version = $env:GITHUB_REF_NAME.TrimStart('v') + '.0' }
          & ./tools/make-msix.ps1 @a

      - name: Build portable zip (exe + lang)
        shell: pwsh
        run: |
          $d = 'build/portable'   # the translations only: the pseudo-languages live under tests/
          New-Item -ItemType Directory -Force "$d/lang" | Out-Null
          Copy-Item powernapp.exe $d
          Copy-Item lang/*.txt "$d/lang"
          Compress-Archive -Path "$d/*" -DestinationPath PowerNapp-portable.zip -Force
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $z = [IO.Compression.ZipFile]::OpenRead("$PWD/PowerNapp-portable.zip")
          $names = $z.Entries.FullName -replace '\\', '/'; $z.Dispose()
          $names
          if ($names -notcontains 'powernapp.exe' -or -not ($names -like 'lang/*.txt')) { throw 'zip is missing powernapp.exe or lang/*.txt' }
          if ($names -like '*qps-*') { throw 'pseudo-languages must not ship' }

      - uses: actions/upload-artifact@v4
        with:
          name: PowerNapp
          path: |
            powernapp.exe
            PowerNapp-setup.exe
            PowerNapp.msix
            PowerNapp-portable.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            powernapp.exe
            PowerNapp-setup.exe
            PowerNapp.msix
            PowerNapp-portable.zip
